<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>ログイン｜プレ面談予約デスク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>:root{--bg:#f3f5f7;--surface:#fff;--sunk:#e9edf1;--line:#d5dce3;--ink:#18222e;--muted:#5b6876;--accent:#0b6b73;--accent-ink:#fff;--crit:#b4232c;--crit-soft:#fbe0e1;--ok:#17803d;--ok-soft:#dcf2e3;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#11171d;--surface:#18212a;--sunk:#0d1318;--line:#2c3843;--ink:#e4eaf0;--muted:#97a5b3;--accent:#4fb8c0;--accent-ink:#06282b;--crit:#f17a80;--crit-soft:#3d1a1d;--ok:#5fcf86;--ok-soft:#14321f;color-scheme:dark}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
input,select,button{font:inherit;color:inherit} [hidden]{display:none!important}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.sm{padding:4px 10px;font-size:12px}
.err{background:var(--crit-soft);color:var(--crit);padding:8px 12px;border-radius:6px;font-size:13px}
.ok{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:6px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px} p{margin:0;color:var(--muted);font-size:13px}
</style></head>
<body><main>
<form id="f" autocomplete="on">
  <h1>プレ面談予約デスク</h1>
  <p>出会えるエージェント × 架電代行。発行されたメールアドレスとパスワードでログインしてください。</p>
  <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
  <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" hidden></div>
  <button class="btn primary" id="go" type="submit">ログイン</button>
  <p>パスワードを忘れたときは、foresmaの管理者に再発行を依頼してください。</p>
</form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.hidden = true; go.disabled = true; go.textContent = "確認しています…";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: document.getElementById("email").value, password: document.getElementById("password").value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "ログインできませんでした");
    location.href = "/";
  } catch (x) { err.textContent = x.message; err.hidden = false; go.disabled = false; go.textContent = "ログイン"; }
});
</script>
</body></html>
