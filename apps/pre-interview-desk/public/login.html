<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>ログイン｜プレ面談予約デスク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>:root{--bg:#f3f5f7;--surface:#fff;--sunk:#e9edf1;--line:#d5dce3;--ink:#18222e;--muted:#5b6876;--accent:#0b6b73;--accent-ink:#fff;--crit:#b4232c;--crit-soft:#fbe0e1;--ok:#17803d;--ok-soft:#dcf2e3;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#11171d;--surface:#18212a;--sunk:#0d1318;--line:#2c3843;--ink:#e4eaf0;--muted:#97a5b3;--accent:#4fb8c0;--accent-ink:#06282b;--crit:#f17a80;--crit-soft:#3d1a1d;--ok:#5fcf86;--ok-soft:#14321f;color-scheme:dark}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
input,select,button{font:inherit;color:inherit} [hidden]{display:none!important}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.sm{padding:4px 10px;font-size:12px}
.err{background:var(--crit-soft);color:var(--crit);padding:8px 12px;border-radius:6px;font-size:13px}
.ok{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:6px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px} p{margin:0;color:var(--muted);font-size:13px}
.btn.google{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;padding:11px 16px}
.btn.google:hover{background:var(--sunk)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)} .pw{display:flex;flex-direction:column;gap:12px;margin-top:12px}
</style></head>
<body><main>
<form id="f" autocomplete="on">
  <h1>プレ面談予約デスク</h1>
  <p>出会えるエージェント × 架電代行。登録されたメールアドレスのアカウントでログインしてください。</p>
  <div class="err" id="err" hidden></div>
  <a class="btn google" id="google" href="/api/auth/google" hidden>
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Googleでログイン
  </a>
  <details id="pw-box" hidden>
    <summary>メールアドレスとパスワードでログイン</summary>
    <div class="pw">
      <label>メールアドレス<input id="email" type="email" autocomplete="username"></label>
      <label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
      <button class="btn primary" id="go" type="submit">ログイン</button>
    </div>
  </details>
  <p>ログインできないときは、foresmaの管理者にメンバー登録を依頼してください。</p>
</form>
</main>
<script>
const ERR = {
  not_member: "このGoogleアカウントのメールアドレスはメンバー登録されていません。管理者に登録を依頼してください。",
  inactive: "このアカウントは無効になっています。管理者に確認してください。",
  google_cancel: "Googleログインがキャンセルされました。",
  google_state: "ログインの有効期限が切れました。もう一度お試しください。",
  google_failed: "Googleログインに失敗しました。もう一度お試しください。",
  google_off: "Googleログインがまだ設定されていません。",
  server: "サーバーでエラーが起きました。少し待ってからお試しください。"
};
const err = document.getElementById("err");
const code = new URLSearchParams(location.search).get("error");
if (code) { err.textContent = ERR[code] || "ログインできませんでした。"; err.hidden = false; history.replaceState(null, "", "/login"); }
fetch("/api/auth/config").then(r => r.json()).then(c => {
  document.getElementById("google").hidden = !c.google;
  const box = document.getElementById("pw-box"); box.hidden = !c.password; if (c.password && !c.google) box.open = true;
}).catch(() => { document.getElementById("pw-box").hidden = false; document.getElementById("pw-box").open = true; });
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go");
  err.hidden = true; go.disabled = true; go.textContent = "確認しています…";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: document.getElementById("email").value, password: document.getElementById("password").value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "ログインできませんでした");
    location.href = "/";
  } catch (x) { err.textContent = x.message; err.hidden = false; go.disabled = false; go.textContent = "ログイン"; }
});
</script>
</body></html>
